name: CI
on:
  push:
    branches: [main, 'refactor/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runtime
        run: node --version && npm --version
      - run: npm install
      - run: npm run check
      - name: Snapshot committed runtime
        run: cp -R app .committed-app
      - run: npm run build
      - name: Verify compiled runtime is committed and current
        run: node scripts/verify-runtime-sync.mjs .committed-app app
      - name: Verify deploy entry exists
        run: test -f index.html && test -f app/main.js && test -f content/manifest.json
