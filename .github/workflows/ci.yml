name: CI
on:
  push:
    branches: [main, 'refactor/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npm run check
      - run: npm run build
      - name: Verify deploy entry exists
        run: test -f index.html && test -f app/main.js && test -f content/manifest.json
